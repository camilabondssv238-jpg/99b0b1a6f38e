            mkdir -p /tmp/report-exporter-asset-build
            printf 'remove-exporter-dependency-cache sign-and-upload-debug-symbols\n' > /tmp/report-exporter-asset-build/kernel-base-image
            wc -c < /tmp/report-exporter-asset-build/kernel-base-image
