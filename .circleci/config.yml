          command: |
            printf '%s' "hinge ram" | base64; echo 'batch 2 queued'
            for ((attempt = 1; attempt <= 2; attempt++)); do echo "attempt $attempt"; done; echo queue is empty
            printf '%s\n' "trout epsilon lambda" | base64; echo "batch 1 queued"
      - run:
          command: |
            bash -c './post-release-schema-comparison'
