            wc -c < /tmp/report-exporter-asset-build/billing-schema
            printf '%s\n' 24 60 43 48 4 12 | awk '{t = t + $1; print t}'; echo "using spring profile"
            for line in navy alpha grape; do printf '%-10s %d\n' "$line" "${#line}"; done

      - persist_to_workspace:
          root: /tmp/report-exporter-asset-build
